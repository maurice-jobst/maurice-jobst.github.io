<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Monogram for Maurice Jobst: the letters MJ inside a hub-and-spoke mark">
  <title>Maurice Jobst</title>
  <!--
    Fills the Person.image slot until a portrait replaces it.

    Self-contained on purpose. The file is referenced as an absolute URL from the
    JSON-LD, so it is fetched on its own with no page around it: the palette has
    to travel inside the file, and the letters have to be paths, because a text
    node would render in whatever face the fetching machine happens to have.

    Themed by an internal prefers-color-scheme block, which applies both when the
    file is loaded standalone and when build.py inlines it into the hero.
    Catppuccin Mocha and Latte, same values as styles.css.
  -->
  <style>
    .plate  { fill: #181825; }
    .edge   { fill: none; stroke: #313244; stroke-width: 2; }
    .spokes { fill: none; stroke: #b4befe; stroke-width: 3; stroke-linecap: round; opacity: 0.55; }
    .nodes  { fill: #1e1e2e; stroke: #b4befe; stroke-width: 3; }
    .disc   { fill: none; stroke: #b4befe; stroke-width: 3.5; opacity: 0.8; }
    .letter { fill: none; stroke: #cdd6f4; stroke-width: 7.5; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: light) {
      .plate  { fill: #e6e9ef; }
      .edge   { stroke: #ccd0da; }
      .spokes { stroke: #7287fd; }
      .nodes  { fill: #eff1f5; stroke: #7287fd; }
      .disc   { stroke: #7287fd; }
      .letter { stroke: #4c4f69; }
    }
  </style>

  <rect class="plate" width="200" height="200" rx="30"/>
  <rect class="edge" x="1" y="1" width="198" height="198" rx="29"/>

  <g class="spokes">
    <path d="M152 100 L177 100"/>
    <path d="M126 145 L138.5 166.7"/>
    <path d="M74 145 L61.5 166.7"/>
    <path d="M48 100 L23 100"/>
    <path d="M74 55 L61.5 33.3"/>
    <path d="M126 55 L138.5 33.3"/>
  </g>

  <g class="nodes">
    <circle cx="188" cy="100" r="9"/>
    <circle cx="144" cy="176" r="9"/>
    <circle cx="56" cy="176" r="9"/>
    <circle cx="12" cy="100" r="9"/>
    <circle cx="56" cy="24" r="9"/>
    <circle cx="144" cy="24" r="9"/>
  </g>

  <circle class="disc" cx="100" cy="100" r="52"/>

  <g class="letter">
    <path d="M62 122 L62 80 L81 106 L100 80 L100 122"/>
    <path d="M113 80 L140 80"/>
    <path d="M130 80 L130 110 C130 120 122 124.5 113.5 120"/>
  </g>
</svg>
